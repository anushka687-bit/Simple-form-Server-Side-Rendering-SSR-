<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<button class="theme-toggle" id="themeToggle">🌙 Dark</button>

<div class="login-wrap">
  <div class="login-card">

    <h1>🔐 Admin Login</h1>
    <p>Sign in to access the dashboard</p>

    <div id="loginMsg" class="api-msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@student.com" required/>
      </div>
      <div class="field" style="margin-top:16px;">
        <label for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="Enter password" required
            style="padding-right:44px;"/>
          <button type="button" id="togglePw"
            style="position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--muted);">
            👁
          </button>
        </div>
      </div>
      <button type="submit" class="submit-btn" style="margin-top:24px;">LOGIN</button>
    </form>

    <div class="nav" style="margin-top:20px;">
      <a href="index.html">&larr; Back to Home</a>
    </div>

  </div>
</div>

<script>
  // Theme
  document.getElementById('themeToggle').addEventListener('click', function () {
    document.body.classList.toggle('dark');
    this.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
  });

  // Show/hide password
  document.getElementById('togglePw').addEventListener('click', function () {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? '👁' : '🙈';
  });

  // Login form submit
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = this.querySelector('button[type="submit"]');
    const msgEl    = document.getElementById('loginMsg');

    btn.disabled    = true;
    btn.textContent = 'LOGGING IN...';

    try {
      const res  = await fetch('http://localhost:5000/api/admin/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password })
      });
      const json = await res.json();

      if (json.success) {
        // Save token to localStorage
        localStorage.setItem('adminToken', json.token);
        localStorage.setItem('adminEmail', email);
        showMsg('✅ Login successful! Redirecting...', true);
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        showMsg('❌ ' + json.message, false);
        btn.disabled    = false;
        btn.textContent = 'LOGIN';
      }
    } catch (err) {
      showMsg('❌ Cannot connect to server. Is it running?', false);
      btn.disabled    = false;
      btn.textContent = 'LOGIN';
    }

    function showMsg(msg, success) {
      msgEl.textContent      = msg;
      msgEl.style.display    = 'block';
      msgEl.style.background = success ? 'rgba(16,185,129,0.1)' : 'rgba(220,38,38,0.1)';
      msgEl.style.border     = `1.5px solid ${success ? 'rgba(16,185,129,0.3)' : 'rgba(220,38,38,0.3)'}`;
      msgEl.style.color      = success ? '#10b981' : '#dc2626';
    }
  });
</script>
</body>
</html>
